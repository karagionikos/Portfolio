<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

   <!-- Site Responsive on Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio</title>

  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <!-- Courier Prime Font -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /*Removes Default Browser Spacing/Padding*/
    *, *::before, *::after 
    { 
      box-sizing: border-box; margin: 0; padding: 0; 
    }

    /* ===CSS Centralized Variables=== */
    :root 
    {
      --orange: #FF8000;
      --orange-dim: #cc6600;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --dim: #888888;
      --border: #FF8000;
      --font: 'Courier Prime', Courier, monospace;
    }

    /* ===Page Layout=== */
    html, body 
    {
      height: 100%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font); 
    }

    /* ===Hover Effect=== */
    a:hover 
    {
      text-decoration: underline !important;
      opacity: 0.8;
    }

    /* ===Main Terminal Window=== */
    .window 
    {
      /* Responsive Width */
      width: min(860px, 98vw);

      min-height: 92vh;
      background: var(--bg);

      /* Orange Border */
      border: 2px solid var(--orange);

      /* Vertical Layout */
      display: flex;
      flex-direction: column;

      /* Retro Shadow */
      box-shadow: 0 0 10px #FF800033, 0 0 20px #FF800022, 6px 6px 0 #FF800033;
    }

     /* ===Top Title Bar=== */
    .titlebar 
    {
      background: var(--orange);
      color: #fff;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      display: flex;
      align-items: center;
      gap: 8px;

      /* Prevent Text Selection */
      user-select: none;

      /* Prevent Shrinking */
      flex-shrink: 0;
    }

    /* ===Small Fake Window Buttons=== */
    .dot 
    { 
      width: 12px; 
      height: 12px; 
      border-radius: 50%; 
      background: rgba(255,255,255,0.45); 
      display: inline-block; 
    }

    /* ===Terminal Output Screen=== */
    .screen 
    {
      flex: 1;
      padding: 20px 22px 8px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.7;
      color: var(--fg);
      min-height: 0;
      padding-bottom: 40px;
    }

    /* Custom CMD Like Blinking Cursor */
    .cursor 
    {
      display: inline-block;
      width: 5px;
      vertical-align: text-bottom;
      background: var(--orange);
      margin-left: 3px;
      animation: blink 1.3s step-start infinite;
    }
    
    @keyframes blink 
    {
      50% {opacity: 0;}
    }

    /* ===Line Types=== */
    /* Formatting and Wraps Long Lines */
    .line 
    {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Orange Highlighted Text */
    .line.orange 
    {
      color: var(--orange);
      font-weight: 700;

      /* Tight ASCII spacing */
      line-height: 0.9;
    }

    /* Secondary Text */
    .line.dim 
    {
      color: var(--dim);
    }

    /* Bold Text */
    .line.bold 
    {
      font-weight: 700;
    }

    /* Indented Lines */
    .line.indent 
    {
      padding-left: 20px;
    }

    /* Command echo Styling */
    .line.echo 
    {
      color: var(--fg);
    }

    /* Orange Prompt Inside echo */
    .line.echo .p 
    {
      color: var(--orange);
      font-weight: 700;
    }

    /* Error Message Style */
    .line.err 
    {
      color: var(--dim);
      font-style: italic;
    }

    /* ===Input Area=== */
    .input-row 
    {
      display: flex;
      align-items: center;
      padding: 9px 22px 14px;
      border-top: 1px solid var(--orange);
      flex-shrink: 0;
      gap: 0;
    }

    /* Terminal Prompt */
    .prompt-sym 
    {
      color: var(--orange);
      font-weight: 700;
      font-size: 14px;
      font-family: var(--font);
      white-space: nowrap;
      user-select: none;
    }

    /* User Typing Input */
    .cmd-input 
    {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 14px;
      color: var(--fg);
      background: transparent;
      caret-color: transparent;
      padding: 0 7px;
      letter-spacing: 0.03em;
    }

    /* Placeholder Text */
    .cmd-input::placeholder 
    { 
      color: #bbb; 
    }

    /* ===Mobile Responsiveness=== */
    @media (max-width: 600px) 
    {
      .screen    { font-size: 12px; padding: 14px 12px 6px; }
      .input-row { padding: 8px 12px 12px; }
      .prompt-sym, .cmd-input { font-size: 12px; }
    }
    
  </style>
</head>


<body>
    <!-- ===Main Terminal=== -->
    <div class="window">
    <div class="titlebar">

      <!-- Window Control Dots -->
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

      <!-- Fake Virtual Path -->
      &nbsp;&nbsp;C:\USER\PORTFOLIO&gt;
    </div>

    <!-- Terminal Output Area -->
    <div class="screen" id="screen">
    </div>

    <!-- Input Row -->
    <div class="input-row">

      <!-- Prompt -->
      <span class="prompt-sym">
        C:\USER\PORTFOLIO&gt;&nbsp;
        <span class="cursor">|</span>
      </span>

      <!-- Command Input -->
      <input
        class="cmd-input"
        id="cmd"
        type="text"
        autocomplete="off"
        spellcheck="false"
        autofocus
        placeholder="type a command..."
        aria-label="Command input"
      />
    </div>
  </div>

  <script>
    /* ===DOM References=== */
    const screen = document.getElementById('screen');
    const input  = document.getElementById('cmd');

    /* ===Site Data=== */
    const data = 
    {
      //Name
      name:  "Nikolaos Karageorgis",

      //Title
      title: "CS & Informatics Major",

      //About Page
      about: [
        "Hey there, I'm Nikos, a  4th-year student of  Applied Informatics",
        "at the  University of  Macedonia.  I like  software  engineering,",
        "data-driven problem-solving, emerging technologies and many more.",
        "I enjoy working on both personal and team projects, whether thats", 
        "through web development, algorithms, apps or AI-related.",
        " ",
        "Through coursework and personal projects,I have gained experience",
        "with programming languages,  tools and ways of modern development",
        "frameworks.",
        " ",
        "I'm searching for opportunities to learn, grow, work with others,",
        "and get hands-on experience.",
      ],

      //Skills Page
      skills: [
        "Soft Skills:",
        " • Problem Solving",
        " • Critical Thinking",
        " • Adaptability",
        " • Teamwork",
        "------------- ",
        "Languages:",
        " • Python",
        " • C++",
        " • C#",
        " • C",
        " • Java",
        " • Javascript",
        " • HTML",
        " • CSS",
        " • MySQL",
        "------------- ",
        "Tooling:",
        " • Software Development & Coding Tools",
        " • Large Language Models",
        " • Collaboration & Management",
        " • Specialized Development Tools",
      ],

      //Projects Page
      projects: [
        { name: "Terminal Portfolio", desc: "This site — a terminal-style portfolio built in vanilla JS." },
        { name: "Unity 3rd Person Movement & Camera", desc: "3rd person movement and camera — using the 'Character Controller' & 'Cinemachine'." },
        { name: "Classification Problem W/ Machine-Learning", desc: "Classification problem, solved W/ 8 different ML algorithms, presenting scores, graphs, and more." },
        { name: "Neural Networks in Computer Vision", desc: "Code using Deep Learning models for image classification, utilizing Transfer Learning." },
      ],

      //Contact Page
      contact: [
        {
          label: "Email",
          text: "karagionikos@gmail.com",
          href: "mailto:karagionikos@gmail.com"
        },
        
        {
          label: "GitHub",
          text: "github.com/karagionikos",
          href: "https://github.com/karagionikos"},
        
        {
          label: "LinkedIn",
          text: "linkedin.com/in/nikolaos-karageorgis",
          href: "https://linkedin.com/in/nikolaos-karageorgis"
        }
      ],

      //Education Page
      education: [
        "Currently Studying as a 4th year, Applied Informatics at University of Macedonia",
        "",
      ],
    };

    /* Divider Line in Sections */
    const DIVIDER = { t: "dim", v: "──────────────────────────────────────────" };


    /* ===Command System=== */
    const COMMANDS = 
    {
      help: () => [
        { t: "orange", v: "Available commands:" },
        DIVIDER,
        { t: "indent", v: "about" },
        { t: "indent", v: "skills" },
        { t: "indent", v: "contact" },
        { t: "indent", v: "projects" },
        { t: "indent", v: "education" },
        { t: "orange", v: " ------------ " },
        { t: "indent", v: "resume" },
        { t: "indent", v: "date" },
        { t: "orange", v: " ------------ " },
        { t: "indent", v: "banner" },
        { t: "indent", v: "clear" },
        DIVIDER,
        { t: "dim",    v: "Tip: Tab autocompletes · ↑↓ for history" },
        { t: "", v: "" },
      ],

      /* About Command */
      about: () => [
        { t: "orange", v: "[ ABOUT ]" },
        DIVIDER,
        ...data.about.map(v => ({ t: "", v })),
        { t: "", v: "" },
      ],

      /* Skills Command */
      skills: () => [
        { t: "orange", v: "[ SKILLS ]" },
        DIVIDER,
        ...data.skills.map(v => ({ t: "", v })),
        { t: "", v: "" },
      ],

      /* Projects Command */
      projects: () => [
        { t: "orange", v: "[ PROJECTS ]" },
        DIVIDER,
        ...data.projects.flatMap(p => [
          { t: "bold",   v: "> " + p.name },
          { t: "indent", v: p.desc },
          { t: "", v: "" },
        ]),
      ],

      /* Education Command */
      education: () => [
        { t: "orange", v: "[ EDUCATION ]" },
        DIVIDER,
        ...data.education.map(v => ({ t: "", v })),
        { t: "", v: "" },
      ],

      /* Contact Command */
      contact: () => {
        renderContacts();
        return null;
      },

      /* Show Starting Banner Command */
      banner: () => { 
        addLines(getBanner()); return null; 
      },

      /* Clear Screen Command */
      clear:  () => { 
        screen.innerHTML = ''; addLines(getBanner()); return null; 
      },

      /* Date Command */
      date: () => [
        {v: new Date().toLocaleString()},
        { t: "", v: ""},
      ],

      /* Resume Command */
      resume: () =>
      {
        window.open("./CV.pdf", "_blank");
        
        return 
        [
          { t: "dim", v: "[SYSTEM] Accessing resume file..." },
          { t: "orange", v: "Resume opened successfully." },
          { t: "", v: "" },
        ];
      },
    };

    /* ===Welcome Banner=== */
    function getBanner() 
    {
      return [
        { t: "orange", v: "                ##                         " },
        { t: "orange", v: " ##.##:   ###   ##   ##:  .####.   :#####. " },
        { t: "orange", v: " #######  ####  ##  ##:  .######. ######## " },
        { t: "orange", v: " ###  :##   ##  ##:##:   ###  ### ##:  .:# " },
        { t: "orange", v: " ##    ##   ##  ####     ##.  .## ##### .  " },
        { t: "orange", v: " ##    ##   ##  #####    ##    ## .######: " },
        { t: "orange", v: " ##    ##   ##  ##.###   ##.  .##    .: ## " },
        { t: "orange", v: " ##    ##   ##  ##  ##:  ###  ### #:.  :## " },
        { t: "orange", v: " ##    ##   ##  ##  :##  .######. ######## " },
        { t: "orange", v: " ##    ## ##### ##   ###  .####.  . ####   " },
        { t: "orange", v: "                                           " },                                       

        { t: "", v: "" },

        { t: "bold",   v: "  " + data.name + " . " + data.title },
        { t: "dim",    v: "  ──────────────────────────────────────────" },
        { t: "",       v: "  Welcome. Type help to get started." },

        { t: "", v: "" },
      ];
    }

    /* ===Render Lines==== */
    async function addLines(lines, speed = 8)
    {
      for (const { t, v } of lines)
      {
        const d = document.createElement('div');
        d.className = 'line' + (t ? ' ' + t : '');
        
        screen.appendChild(d);
        
        // Type line character-by-character
        for (let i = 0; i < v.length; i++)
        {
          d.textContent += v[i];
          screen.scrollTop = screen.scrollHeight;
          
          await sleep(speed);
        }
        
        // Small pause between lines
        await sleep(20);
      }
    }

    //Rendering Contacts
    async function renderContacts()
    {
      await addLines(
      [
        { t: "orange", v: "[ CONTACT ]" },
        
        DIVIDER,
      ]);
      
      for (const item of data.contact)
      {
        const d = document.createElement('div');
        
        d.className = 'line';
        
        d.innerHTML = `<span style="color: var(--fg)"> ${item.label}: </span> <a href= "${item.href}" target= "_blank" style= "color: var(--orange); text-decoration: none;"> ${item.text} </a>`;
        
        screen.appendChild(d);
        screen.scrollTop = screen.scrollHeight;
        
        await sleep(120);
      }
      
      await addLines([{ t: "", v: "" }]);
    }

    /* Gradual Character Appearence */
    function sleep(ms)
    {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /* Adds Boot Sequence */
    async function bootSequence()
    {
      // Disable typing during boot
      input.disabled = true;

      await addLines(
      [
        { t: "dim", v: "[SYSTEM] Initializing portfolio system..." },
      ], 15);
      
      await sleep(400);
      await addLines(
      [
        { t: "dim", v: "[SYSTEM] Loading portfolio modules..." },
      ], 15);
      
      await sleep(300);
      await addLines(
      [
        { t: "dim", v: "[SYSTEM] Establishing secure connection..." },
      ], 15);
      
      await sleep(300);
      await addLines(
      [
        { t: "dim", v: "[SYSTEM] STATUS: ONLINE." },
      ], 15);
      
      await sleep(500);
      await addLines(
      [
        { t: "", v: "" },
      ]);
      
      // Show actual banner
      await addLines(getBanner(), 2);

      // Re-enable typing AFTER boot finishes
      input.disabled = false;
      input.focus();
}

    /* ===Show User Command in Terminal=== */
    function echoCmd(raw) 
    {
      const d = document.createElement('div');

      d.className = 'line echo';
      d.innerHTML = '<span class="p">C:\\USER\\PORTFOLIO&gt; </span>' + esc(raw);

      screen.appendChild(d);
    }

    /* ===Escape HTML/Prevents HTML Injection=== */
    function esc(s) 
    {
      return s
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
    }

    /* ===Command History=== */
    // Stores Previous Commands
    const history = [];
    let histIdx = -1;

    /* ===Run Command=== */
    async function run(raw) 
    {
      // Normalize Command
      const cmd = raw.trim().toLowerCase();

      // Ignore Empty Input
      if (!cmd) 
      return;

      // Save Command to History
      history.unshift(raw.trim());

      // Reset History Navigation
      histIdx = -1;

      // Show Typed Command
      echoCmd(raw.trim());

      // Check if Command Exists
      if (cmd in COMMANDS) 
      {
        // Execute Command
        const result = COMMANDS[cmd]();

        // Render Result if Returned
        if (result)
        await addLines(result);

      } 

      else 
      {
        // Smart Command Suggestions
        const commands = Object.keys(COMMANDS);
        const suggestion = commands.find
        (
          c => c.startsWith(cmd[0])
        );
        
        addLines(
        [
          { t: "err", v: `'${cmd}' is not recognized.` },
          
          suggestion

          ? { t: "dim", v: `Did you mean '${suggestion}' ?` }: 

          { t: "dim", v: "Type help for available commands." },
          { t: "", v: "" },
        ]);
      }
    }

    /* ===Keyboard Input=== */
    input.addEventListener('keydown', e => 
    {
      /* Enter = execute command */
      if (e.key === 'Enter') 
      {
        const val = input.value;

        // Clear input
        input.value = '';

        // Run command
        run(val);
      }

      /* Tab Autocoplete */
      else if (e.key === 'Tab')
      {
        e.preventDefault();
        const value = input.value.trim().toLowerCase();
        
        if (!value) 
        return;
        
        const commands = Object.keys(COMMANDS);
        const matches = commands.filter
        (
          cmd => cmd.startsWith(value)
        );
        
        if (matches.length === 1)
        {
          input.value = matches[0];
        }
      }

      /* Up Arrow = Previous Command */
      else if (e.key === 'ArrowUp') 
      {
        e.preventDefault();

        if (histIdx < history.length - 1) {
          histIdx++;
          input.value = history[histIdx];
        }
      }

      /* Down Arrow = Newer Command*/
      else if (e.key === 'ArrowDown')
      {
        e.preventDefault();

        if (histIdx > 0) 
        {
          histIdx--;
          input.value = history[histIdx];
        } 
        
        else 
        {
          histIdx = -1;
          input.value = '';
        }
      }
    });

    /* ===Click Terminal to Focus=== */
    document
      .querySelector('.window')
      .addEventListener('click', () => input.focus());

    /* ===Initialize Terminal=== */
    // Show Startup Banner
    bootSequence();

  </script>
</body>
</html>
