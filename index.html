<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

   <!-- Site Responsive on Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio</title>

  <link rel="icon" href="favicon.ico">

  <!-- JetBrains Mono Font -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /*Removes Default Browser Spacing/Padding*/
    *, *::before, *::after 
    { 
      box-sizing: border-box; margin: 0; padding: 0; 
    }

    /* ===CSS Centralized Variables=== */
    :root 
    {
      --orange: #FF8000;
      --bg: #0d0d0d;
      --bar: #1a1a1a;
      --line: #262626;
      --fg: #e6e6e6;
      --dim: #8a8a8a;
      --glow: 0 0 6px #FF800099;
      --font: 'JetBrains Mono', Consolas, monospace;
    }

    /* ===Page Layout=== */
    html, body
    {
      height: 100%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
    }

    /* Faint orange glow behind the window */
    body
    {
      background: radial-gradient(ellipse at center, #FF80001f 0%, transparent 60%), #080808;
    }

    /* ===Links (contact)=== */
    .line a
    {
      color: var(--orange);
      text-decoration: none;
    }

    a:hover
    {
      text-decoration: underline;
      opacity: 0.8;
    }

    /* ===Main Terminal Window=== */
    .window 
    {
      /* Responsive Width */
      width: min(860px, 98vw);

      /* Fixed height so long output scrolls inside the window */
      height: 92dvh;
      background: var(--bg);

      /* Rounded Window */
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      position: relative;

      /* Vertical Layout */
      display: flex;
      flex-direction: column;

      /* Soft Drop Shadow */
      box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
    }

    /* CRT Scanlines Over the Window */
    .window::after
    {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
    }

     /* ===Top Title Bar=== */
    .titlebar
    {
      background: var(--bar);
      color: var(--dim);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 12px;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;

      /* Prevent Text Selection */
      user-select: none;

      /* Prevent Shrinking */
      flex-shrink: 0;
    }

    /* Centered Window Title */
    .title
    {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
    }

    /* ===Small Fake Window Buttons=== */
    .dot
    {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot:nth-child(1) { background: #ff5f57; }
    .dot:nth-child(2) { background: #febc2e; }
    .dot:nth-child(3) { background: #28c840; }

    /* ===Terminal Output Screen=== */
    .screen 
    {
      flex: 1;
      padding: 20px 22px 8px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.7;
      color: var(--fg);
      min-height: 0;
      padding-bottom: 40px;
    }

    /* Blinking Block Cursor */
    .cursor
    {
      display: inline-block;
      width: 0.6em;
      height: 1.15em;
      vertical-align: text-bottom;
      background: var(--orange);
      box-shadow: var(--glow);
      margin-left: 3px;
      animation: blink 1.3s step-start infinite;
    }
    
    @keyframes blink
    {
      50% {opacity: 0;}
    }

    /* Phosphor Banner Entrance: rows flicker on independently, like a warming tube */
    .line.power-on
    {
      animation: phosphor 600ms steps(1, end) both;
    }

    /* Offsets so neighbouring rows don't flicker in sync */
    .line.power-on:nth-child(3n)   { animation-delay: 90ms; }
    .line.power-on:nth-child(3n+1) { animation-delay: 20ms; }
    .line.power-on:nth-child(3n+2) { animation-delay: 150ms; }

    @keyframes phosphor
    {
      0%  { opacity: 0; }
      20% { opacity: 1; }
      35% { opacity: 0.25; }
      50% { opacity: 1; }
      70% { opacity: 0.6; }
      85% { opacity: 1; }
    }

    /* Reduced motion: gentle fade instead of flicker, steady cursor */
    @media (prefers-reduced-motion: reduce)
    {
      .line.power-on { animation: fade 400ms ease both; }
      .cursor { animation: none; }
    }

    @keyframes fade
    {
      from { opacity: 0; }
    }

    /* ===Line Types=== */
    /* Formatting and Wraps Long Lines */
    .line 
    {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Orange Highlighted Text */
    .line.orange
    {
      color: var(--orange);
      font-weight: 700;
      text-shadow: var(--glow);

      /* Tight ASCII spacing */
      line-height: 0.9;
    }

    /* Secondary Text */
    .line.dim 
    {
      color: var(--dim);
    }

    /* Bold Text */
    .line.bold 
    {
      font-weight: 700;
    }

    /* Indented Lines */
    .line.indent 
    {
      padding-left: 20px;
    }

    /* Orange Prompt Inside echo */
    .line.echo .p
    {
      color: var(--orange);
      font-weight: 700;
      text-shadow: var(--glow);
    }

    /* Error Message Style */
    .line.err 
    {
      color: var(--dim);
      font-style: italic;
    }

    /* ===Input Area=== */
    .input-row 
    {
      display: flex;
      align-items: center;
      padding: 9px 22px 14px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    /* Terminal Prompt */
    .prompt-sym
    {
      color: var(--orange);
      font-weight: 700;
      text-shadow: var(--glow);
      font-size: 14px;
      font-family: var(--font);
      white-space: nowrap;
      user-select: none;
    }

    /* User Typing Input */
    .cmd-input 
    {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 14px;
      color: var(--fg);
      background: transparent;
      caret-color: transparent;
      padding: 0 7px;
      letter-spacing: 0.03em;
    }

    /* Placeholder Text */
    .cmd-input::placeholder 
    { 
      color: #555;
    }

    /* ===Mobile Responsiveness=== */
    @media (max-width: 600px) 
    {
      .screen    { font-size: 12px; padding: 14px 12px 6px; }
      .input-row { padding: 8px 12px 12px; }
      .prompt-sym { font-size: 12px; }

      /* 16px stops iPhone Safari zooming in when the input is tapped */
      .cmd-input  { font-size: 16px; }
    }
    
  </style>
</head>


<body>
    <!-- ===Main Terminal=== -->
    <div class="window">
    <div class="titlebar">

      <!-- Window Control Dots -->
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

      <!-- Window Title -->
      <span class="title">nikos — portfolio</span>
    </div>

    <!-- Terminal Output Area -->
    <div class="screen" id="screen" role="log" aria-live="polite">
    </div>

    <!-- Input Row -->
    <div class="input-row">

      <!-- Prompt -->
      <span class="prompt-sym">
        nikos@portfolio:~$&nbsp;
        <span class="cursor"></span>
      </span>

      <!-- Command Input -->
      <input
        class="cmd-input"
        id="cmd"
        type="text"
        autocomplete="off"
        spellcheck="false"
        autofocus
        placeholder="type a command..."
        aria-label="Command input"
      />
    </div>
  </div>

  <script>
    /* ===DOM References=== */
    const screen = document.getElementById('screen');
    const input  = document.getElementById('cmd');

    // Prompt text lives once, in the HTML input row
    const PROMPT = document.querySelector('.prompt-sym').textContent.trim();

    /* ===Site Data=== */
    const data = 
    {
      //Name
      name:  "Nikolaos Karageorgis",

      //Title
      title: "CS & Informatics Major",

      //About Page
      about: [
        "Hey there,   I'm Nikos,   a  5th-year student  of   Applied Informatics",
        "at  the  University  of  Macedonia.   Currently  an  engineering intern",
        "working  on  a  data pipeline researching startups'  digital footprint.",
        " ",
        "I'm passionate about software engineering, data-driven problem-solving,",
        "and  emerging  technologies.   I  enjoy  projects  merging  design  and",
        "practical use  —  web dev,  algorithms, apps, AI, and LLM applications.",
        " ",
        "Through coursework and personal projects, I have gained experience with",
        "programming languages   and   tools  for modern development frameworks.",
        " ",
        "Curious, adaptable, and  a lifelong learner — looking for opportunities",
        "to grow, collaborate, and help build innovative solutions.",
      ],

      //Skills Page
      skills: [
        "Soft Skills:",
        " • Problem Solving",
        " • Critical Thinking",
        " • Adaptability",
        " • Teamwork",
        "------------- ",
        "Languages:",
        " • Python",
        " • C++",
        " • C#",
        " • C",
        " • Java",
        " • Javascript",
        " • HTML",
        " • CSS",
        " • MySQL",
        "------------- ",
        "Tooling:",
        " • Software Development & Coding Tools",
        " • Large Language Models",
        " • Collaboration & Management",
        " • Specialized Development Tools",
      ],

      //Projects Page
      projects: [
        { name: "Terminal Portfolio", desc: "This site — a terminal-style portfolio built in vanilla JS." },
        { name: "Glyph", desc: "A browser-based ASCII art generator. Created with vanilla HTML, CSS, and JavaScript." },
        { name: "Simple File System", desc: "A virtual disk-based file system simulator written in C." },
        { name: "Music Controller App", desc: "A desktop Spotify remote control. Built with Electron + React + TypeScript." },
        { name: "Unity 3rd Person Movement & Camera", desc: "3rd person movement and camera — using the 'Character Controller' & 'Cinemachine'." },
        { name: "Classification Problem W/ Machine-Learning", desc: "Classification problem, solved W/ 8 different ML algorithms, presenting scores, graphs, and more." },
        { name: "Neural Networks in Computer Vision", desc: "Code using Deep Learning models for image classification, utilizing Transfer Learning." },
        { name: "Coffee Machine Energy Prediction", desc: "Focuses on Non-Intrusive Load Monitoring. Implemented a Neural Network built with Python." },
      ],

      //Contact Page
      contact: [
        {
          label: "Email",
          text: "karagionikos@gmail.com",
          href: "mailto:karagionikos@gmail.com"
        },
        
        {
          label: "GitHub",
          text: "github.com/karagionikos",
          href: "https://github.com/karagionikos"},
        
        {
          label: "LinkedIn",
          text: "linkedin.com/in/nikolaos-karageorgis",
          href: "https://linkedin.com/in/nikolaos-karageorgis"
        }
      ],

      //Education Page
      education: [
        "Currently Studying, Applied Informatics at University of Macedonia",
        "",
      ],

      //Experience Page
      experience: [
        { role: "Engineer, Business Developer & Digital Marketing Intern", company: "Cruxivity", period: "Current" },
      ],
    };

    /* Divider Line in Sections */
    const DIVIDER = { t: "dim", v: "──────────────────────────────────────────" };


    /* Titled Section of Plain Lines */
    function section(title, lines)
    {
      return [
        { t: "orange", v: `[ ${title} ]` },
        DIVIDER,
        ...lines.map(v => ({ t: "", v })),
        { t: "", v: "" },
      ];
    }

    /* ===Command System=== */
    const COMMANDS = 
    {
      help: () => [
        { t: "orange", v: "Available commands:" },
        DIVIDER,
        { t: "indent", v: "about" },
        { t: "indent", v: "skills" },
        { t: "indent", v: "contact" },
        { t: "indent", v: "projects" },
        { t: "indent", v: "education" },
        { t: "indent", v: "experience" },
        { t: "orange", v: " ------------ " },
        { t: "indent", v: "resume" },
        { t: "indent", v: "date" },
        { t: "orange", v: " ------------ " },
        { t: "indent", v: "banner" },
        { t: "indent", v: "clear" },
        DIVIDER,
        { t: "dim",    v: "Tip: Tab autocompletes · ↑↓ for history" },
        { t: "", v: "" },
      ],

      /* About Command */
      about: () => section("ABOUT", data.about),

      /* Skills Command */
      skills: () => section("SKILLS", data.skills),

      /* Projects Command */
      projects: () => [
        { t: "orange", v: "[ PROJECTS ]" },
        DIVIDER,
        ...data.projects.flatMap(p => [
          { t: "bold",   v: "> " + p.name },
          { t: "indent", v: p.desc },
          { t: "", v: "" },
        ]),
      ],

      /* Education Command */
      education: () => section("EDUCATION", data.education),

      /* Experience Command */
      experience: () => [
        { t: "orange", v: "[ EXPERIENCE ]" },
        DIVIDER,
        ...data.experience.flatMap(e => [
          { t: "bold",   v: "> " + e.company + "  [" + e.period + "]" },
          { t: "indent", v: e.role },
          { t: "", v: "" },
        ]),
      ],

      /* Contact Command */
      contact: () => renderContacts(),

      /* Show Starting Banner Command */
      banner: () => showBanner(),

      /* Clear Screen Command */
      clear:  () => { 
        screen.innerHTML = ''; return showBanner();
      },

      /* Date Command */
      date: () => [
        {v: new Date().toLocaleString()},
        { t: "", v: ""},
      ],

      /* Resume Command */
      resume: () =>
      {
        window.open("./CV.pdf", "_blank");
        
        return [
          { t: "dim", v: "[SYSTEM] Accessing resume file..." },
          { t: "orange", v: "Resume opened successfully." },
          { t: "", v: "" },
        ];
      },
    };

    /* ===Welcome Banner=== */
    function getBanner() 
    {
      return [
        { t: "orange", v: "                ##                         " },
        { t: "orange", v: " ##.##:   ###   ##   ##:  .####.   :#####. " },
        { t: "orange", v: " #######  ####  ##  ##:  .######. ######## " },
        { t: "orange", v: " ###  :##   ##  ##:##:   ###  ### ##:  .:# " },
        { t: "orange", v: " ##    ##   ##  ####     ##.  .## ##### .  " },
        { t: "orange", v: " ##    ##   ##  #####    ##    ## .######: " },
        { t: "orange", v: " ##    ##   ##  ##.###   ##.  .##    .: ## " },
        { t: "orange", v: " ##    ##   ##  ##  ##:  ###  ### #:.  :## " },
        { t: "orange", v: " ##    ##   ##  ##  :##  .######. ######## " },
        { t: "orange", v: " ##    ## ##### ##   ###  .####.  . ####   " },
        { t: "orange", v: "                                           " },                                       

        { t: "", v: "" },

        { t: "bold",   v: "  " + data.name + " . " + data.title },
        { t: "dim",    v: "  ──────────────────────────────────────────" },
        { t: "",       v: "  Welcome. Type 'help' to get started." },

        { t: "", v: "" },
      ];
    }

    /* ===Banner Flickers On (Boot, clear, banner)=== */
    async function showBanner()
    {
      // Flicker only the new banner lines, never older output
      await addLines(getBanner().map(l => ({ ...l, t: l.t + ' power-on' })), 0);
      screen.scrollTop = screen.scrollHeight;
      await sleep(800); // longest delay + duration (150ms + 600ms)
    }

    /* ===Render Lines==== */
    async function addLines(lines, speed = 8)
    {
      // Screen readers wait and read each finished block once, not per character
      screen.setAttribute('aria-busy', 'true');

      for (const { t, v } of lines)
      {
        const d = document.createElement('div');
        d.className = 'line' + (t ? ' ' + t : '');
        
        screen.appendChild(d);
        
        // Speed 0 = print instantly
        if (!speed)
        {
          d.textContent = v;
          continue;
        }

        // Type line character-by-character
        for (let i = 0; i < v.length; i++)
        {
          d.textContent += v[i];
          screen.scrollTop = screen.scrollHeight;

          await sleep(speed);
        }

        // Small pause between lines
        await sleep(20);
      }

      screen.setAttribute('aria-busy', 'false');
    }

    //Rendering Contacts
    async function renderContacts()
    {
      await addLines(
      [
        { t: "orange", v: "[ CONTACT ]" },
        
        DIVIDER,
      ]);
      
      for (const item of data.contact)
      {
        const d = document.createElement('div');
        
        d.className = 'line';
        
        d.innerHTML = ` ${item.label}: <a href="${item.href}" target="_blank">${item.text}</a>`;
        
        screen.appendChild(d);
        screen.scrollTop = screen.scrollHeight;
        
        await sleep(120);
      }
      
      await addLines([{ t: "", v: "" }]);
    }

    /* Wait ms Milliseconds */
    function sleep(ms)
    {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /* Adds Boot Sequence */
    async function bootSequence()
    {
      // Disable typing during boot
      input.disabled = true;

      for (const [v, ms] of [
        ["[SYSTEM] Initializing portfolio system...", 400],
        ["[SYSTEM] Loading portfolio modules...", 300],
        ["[SYSTEM] Establishing secure connection...", 300],
        ["[SYSTEM] STATUS: ONLINE.", 500],
      ])
      {
        await addLines([{ t: "dim", v }], 15);
        await sleep(ms);
      }

      // Wipe the boot log, then flicker the banner on
      screen.innerHTML = '';
      await showBanner();

      // Re-enable typing AFTER boot finishes
      input.disabled = false;
      input.focus();
}

    /* ===Show User Command in Terminal=== */
    function echoCmd(raw) 
    {
      const d = document.createElement('div');

      d.className = 'line echo';
      d.innerHTML = '<span class="p">' + esc(PROMPT) + ' </span>' + esc(raw);

      screen.appendChild(d);
    }

    /* ===Escape HTML/Prevents HTML Injection=== */
    function esc(s) 
    {
      return s
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
    }

    /* ===Command History=== */
    // Stores Previous Commands
    const history = [];
    let histIdx = -1;

    /* ===Run Command=== */
    async function run(raw) 
    {
      // Normalize Command
      const cmd = raw.trim().toLowerCase();

      // Ignore Empty Input
      if (!cmd) 
      return;

      // Save Command to History
      history.unshift(raw.trim());

      // Reset History Navigation
      histIdx = -1;

      // Show Typed Command
      echoCmd(raw.trim());

      // Check if Command Exists
      if (Object.hasOwn(COMMANDS, cmd)) 
      {
        // Execute Command (async ones resolve when their output is done)
        const result = await COMMANDS[cmd]();

        // Render Result if Returned
        if (result)
        await addLines(result);

      } 

      else 
      {
        // Smart Command Suggestions
        const commands = Object.keys(COMMANDS);
        // Suggest the command sharing the longest prefix with the input
        const shared = c => { let i = 0; while (c[i] && c[i] === cmd[i]) i++; return i; };
        const best = commands.reduce((a, c) => shared(c) > shared(a) ? c : a);
        const suggestion = shared(best) ? best : null;
        
        await addLines(
        [
          { t: "err", v: `'${raw.trim()}' is not recognized.` },
          
          suggestion

          ? { t: "dim", v: `Did you mean '${suggestion}'?` }:

          { t: "dim", v: "Type help for available commands." },
          { t: "", v: "" },
        ]);
      }
    }

    /* ===Keyboard Input=== */
    input.addEventListener('keydown', e => 
    {
      /* Enter = execute command */
      if (e.key === 'Enter') 
      {
        const val = input.value;

        // Clear input
        input.value = '';

        // Run command, locked so outputs can't interleave
        input.disabled = true;
        run(val).finally(() => { input.disabled = false; input.focus(); });
      }

      /* Tab Autocomplete */
      else if (e.key === 'Tab')
      {
        e.preventDefault();
        const value = input.value.trim().toLowerCase();
        
        if (!value) 
        return;
        
        const commands = Object.keys(COMMANDS);
        const matches = commands.filter
        (
          cmd => cmd.startsWith(value)
        );
        
        if (matches.length === 1)
        {
          input.value = matches[0];
        }
      }

      /* Up Arrow = Previous Command */
      else if (e.key === 'ArrowUp') 
      {
        e.preventDefault();

        if (histIdx < history.length - 1) {
          histIdx++;
          input.value = history[histIdx];
        }
      }

      /* Down Arrow = Newer Command*/
      else if (e.key === 'ArrowDown')
      {
        e.preventDefault();

        if (histIdx > 0) 
        {
          histIdx--;
          input.value = history[histIdx];
        } 
        
        else 
        {
          histIdx = -1;
          input.value = '';
        }
      }
    });

    /* ===Click Terminal to Focus=== */
    document
      .querySelector('.window')
      .addEventListener('click', () => { if (!getSelection().toString()) input.focus(); });

    /* ===Initialize Terminal=== */
    // Show Startup Banner
    bootSequence();

  </script>
</body>
</html>
